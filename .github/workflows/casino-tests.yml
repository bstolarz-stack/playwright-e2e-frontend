name: Casino tests (secciones-jugar + tragamonedas-spins)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Which specs to run
        required: true
        default: both
        type: choice
        options:
          - both
          - secciones-jugar
          - tragamonedas-spins

jobs:
  test:
    name: Run casino specs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Credentials — set these as repo secrets (Settings -> Secrets and variables -> Actions)
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      LICENSEE: sportsbetpba
      BASE_URL: https://pba.sports.bet.ar
      # CI flag so Playwright behaves consistently
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers + OS deps
        run: npx playwright install --with-deps chromium

      - name: Resolve spec list
        id: specs
        run: |
          case "${{ inputs.spec }}" in
            secciones-jugar)   echo "paths=tests/casino/secciones-jugar.spec.ts" >> "$GITHUB_OUTPUT" ;;
            tragamonedas-spins) echo "paths=tests/casino/tragamonedas-spins.spec.ts" >> "$GITHUB_OUTPUT" ;;
            *)                  echo "paths=tests/casino/secciones-jugar.spec.ts tests/casino/tragamonedas-spins.spec.ts" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run Playwright specs
        run: npx playwright test ${{ steps.specs.outputs.paths }} --reporter=list,html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test-results (videos, screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
