name: TucanWin UAT Full Regression tests

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron es en UTC. Argentina = UTC-3 (sin DST).
    - cron: '0 13 * * 1-5'  # 10:00 Argentina
    - cron: '0 18 * * 1-5'  # 15:00 Argentina

jobs:
  test:
    name: TucanWin UAT regression (login + smoke home)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # TucanWin testing env. Override via repo secrets/variables if needed.
      BASE_URL: https://gfront-tucanwin-testing.gampix.dev
      LICENSEE: tucanwin
      # Credentials are only needed if the (currently skipped) login spec is enabled.
      APP_USERNAME: ${{ secrets.TUCANWIN_APP_USERNAME }}
      PASSWORD: ${{ secrets.TUCANWIN_PASSWORD }}
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers + OS deps
        run: npx playwright install --with-deps chromium

      - name: Clean stale Allure results
        run: rm -rf allure-results allure-report

      - name: Run login.spec.ts (solo @uat)
        run: npx playwright test tests/tucanwin/login.spec.ts --grep "@uat" --reporter=list,html,allure-playwright

      - name: Run smoke suite (solo @uat)
        if: success() || failure()
        run: npx playwright test tests/tucanwin/smoke --grep "@uat" --reporter=list,html,allure-playwright

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Generate Allure HTML report
        if: always()
        run: npx allure generate allure-results -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload test-results (videos, screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Notify Slack (#frontend-tests-e2e)
        if: always() && env.SLACK_WEBHOOK_URL_E2E != ''
        env:
          SLACK_WEBHOOK_URL_E2E: ${{ secrets.SLACK_WEBHOOK_URL_E2E }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ICON="✅"
          if [ "$RUN_STATUS" != "success" ]; then ICON="❌"; fi
          MSG="$ICON *TucanWin UAT Regression* — status: \`$RUN_STATUS\` — commit \`${GITHUB_SHA::7}\` on \`$GITHUB_REF_NAME\`\n<$RUN_URL|Ver corrida en GitHub Actions>"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg text "$MSG" '{text:$text}')" \
            "$SLACK_WEBHOOK_URL_E2E"
